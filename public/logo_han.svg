<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Diamond Background (White) -->
  <polygon points="120,12 228,120 120,228 12,120" fill="#FFFFFF" stroke="#000000" stroke-width="10" stroke-linejoin="miter"/>
  
  <!-- Quadrant 1: Top-Left (Geon ☰ - 3 solid bars) -->
  <!-- Outer bar -->
  <line x1="68" y1="68" x2="114" y2="22" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <!-- Middle bar -->
  <line x1="77" y1="77" x2="114" y2="40" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <!-- Inner bar -->
  <line x1="86" y1="86" x2="114" y2="58" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>

  <!-- Quadrant 2: Top-Right (Ri ☲ - solid, broken, solid) -->
  <!-- Outer bar (solid) -->
  <line x1="172" y1="68" x2="126" y2="22" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <!-- Middle bar (broken) -->
  <line x1="172" y1="82" x2="152" y2="62" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <line x1="144" y1="54" x2="126" y2="36" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <!-- Inner bar (solid) -->
  <line x1="154" y1="86" x2="126" y2="58" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>

  <!-- Quadrant 3: Bottom-Left (Gam ☵ - broken, solid, broken) -->
  <!-- Outer bar (broken) -->
  <line x1="68" y1="172" x2="88" y2="192" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <line x1="96" y1="200" x2="114" y2="218" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <!-- Middle bar (solid) -->
  <line x1="77" y1="163" x2="114" y2="200" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <!-- Inner bar (broken) -->
  <line x1="86" y1="154" x2="97" y2="165" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <line x1="103" y1="171" x2="114" y2="182" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>

  <!-- Quadrant 4: Bottom-Right (Gon ☷ - 3 broken bars) -->
  <!-- Outer bar (broken) -->
  <line x1="172" y1="172" x2="152" y2="192" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <line x1="144" y1="200" x2="126" y2="218" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <!-- Middle bar (broken) -->
  <line x1="163" y1="163" x2="148" y2="178" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <line x1="140" y1="186" x2="126" y2="200" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <!-- Inner bar (broken) -->
  <line x1="154" y1="154" x2="143" y2="165" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>
  <line x1="137" y1="171" x2="126" y2="182" stroke="#000000" stroke-width="6.5" stroke-linecap="square"/>

  <!-- Dividing White Channels -->
  <!-- Vertical Channel -->
  <rect x="116" y="10" width="8" height="220" fill="#FFFFFF"/>
  <!-- Horizontal Channel -->
  <rect x="10" y="116" width="220" height="8" fill="#FFFFFF"/>

  <!-- Center Diamond (White) -->
  <polygon points="120,86 154,120 120,154 86,120" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Center Roman Numeral 'I' -->
  <rect x="117" y="102" width="6" height="36" fill="#000000" rx="0.5"/>
</svg>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master] # Сработает при пуше в main или master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install # Установка всех пакетов, включая Firebase

      - name: Build project
        run: npm run build --if-present || npx tsc # Пытается собрать проект стандартной командой или через компилятор TS

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Указываем папку сборки. GitHub попробует найти dist, build или использует корень
          path: |
            ./dist
            ./build
            ./
          if-no-files-found: ignore

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
